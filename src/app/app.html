<div #rendererContainer class="sphere-wrapper"></div>

<div class="ui-panel left-panel">
  <h3>Навигация [A B C]</h3>
  <div class="control" *ngFor="let axis of ['A', 'B', 'C']">
    <div class="label-row"><label>Ось {{axis}}</label><span class="val">{{ rotation[axis].toFixed(2) }}</span></div>
    <input type="range" min="0" max="6.28" step="0.01" [(ngModel)]="rotation[axis]">
  </div>
  <button (click)="resetRotation()" class="reset-btn">Сброс</button>
</div>

<div class="ui-panel right-panel">
  <h3>Направление</h3>
  <div class="input-grid">
    <div class="input-col"><label>A</label><input type="number" [(ngModel)]="newDir.a" placeholder="0"></div>
    <div class="input-col"><label>B</label><input type="number" [(ngModel)]="newDir.b" placeholder="0"></div>
    <div class="input-col"><label>C</label><input type="number" [(ngModel)]="newDir.c" placeholder="0"></div>
  </div>
  <div class="action-buttons">
    <button (click)="addCustomDirection()" class="add-btn">Добавить</button>
    <button (click)="undoLastDirection()" class="undo-btn">Откат</button>
  </div>
</div>
