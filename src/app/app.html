<div #rendererContainer class="sphere-wrapper"></div>
<div class="ui-panel">
  <h3>Навигация ABC</h3>
  
  <div class="control">
    <div class="label-row">
      <label>Ось A (Z)</label>
      <span class="val">{{ rotation.A.toFixed(2) }}</span>
    </div>
    <input type="range" min="0" max="6.28" step="0.01" [(ngModel)]="rotation.A">
  </div>

  <div class="control">
    <div class="label-row">
      <label>Ось B (X)</label>
      <span class="val">{{ rotation.B.toFixed(2) }}</span>
    </div>
    <input type="range" min="0" max="6.28" step="0.01" [(ngModel)]="rotation.B">
  </div>

  <div class="control">
    <div class="label-row">
      <label>Ось C (Y)</label>
      <span class="val">{{ rotation.C.toFixed(2) }}</span>
    </div>
    <input type="range" min="0" max="6.28" step="0.01" [(ngModel)]="rotation.C">
  </div>
  
  <button (click)="resetRotation()" class="reset-btn">Сброс</button>
</div>

<div #rendererContainer class="sphere-wrapper"></div>
